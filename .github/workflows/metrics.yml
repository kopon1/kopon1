name: Metrics
on:
  # Rebuild the metrics images on a schedule and on manual trigger.
  schedule:
    - cron: "0 0 * * *"     # daily at midnight UTC
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────────
  # Each step below renders one self-hosted SVG into ./metrics/.
  # The README then points at raw.githubusercontent.com/.../metrics/<file>.svg
  # so nothing depends on a live third-party render at page load.
  # ─────────────────────────────────────────────────────────────
  metrics:
    runs-on: ubuntu-latest
    steps:
      # 1) Main overview card — stats, activity, isocalendar of the last year.
      - name: Overview
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/overview.svg
          user: kopon1
          template: classic
          base: "header, activity, community, repositories, metadata"
          config_timezone: America/Los_Angeles
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # 2) Languages — most-used languages, self-hosted.
      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/languages.svg
          user: kopon1
          base: ""
          config_display: columns
          config_timezone: America/Los_Angeles
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_sections: most-used
          plugin_languages_indepth: no

      # 3) Habits / streak-style — coding activity patterns.
      - name: Habits
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/habits.svg
          user: kopon1
          base: ""
          config_timezone: America/Los_Angeles
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

      # 4) Achievements — a richer stats/achievements panel.
      - name: Achievements
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/achievements.svg
          user: kopon1
          base: ""
          config_timezone: America/Los_Angeles
          plugin_achievements: yes
          plugin_achievements_threshold: B
          plugin_achievements_secrets: yes
          plugin_achievements_display: compact
          plugin_achievements_limit: 0
